[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclip"
version = "1.0.0rc1"
description = "AutoClip local processing worker"
requires-python = ">=3.11"

[project.scripts]
autoclip-worker = "autoclip.desktop_worker:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoclip = ["assets/detectors/*.tflite", "assets/detectors/*.json"]
